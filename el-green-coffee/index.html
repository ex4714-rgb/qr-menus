    <title>El green Coffee - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes+ou+Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap'>
    <style>
        :root {
            --bg-color: radial-gradient(circle at 20% 30%, rgba(34, 139, 34, 0.3) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(139, 69, 19, 0.3) 0%, transparent 50%), #2f2f2f;
            --text-color: #ffffff;
            --accent-color: #8bc34a;
            --font-title: 'Great Vibes ou Playfair Display', serif;
        }

        html {
            background-color: transparent;
            color: #ffffff;
        }

        
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -3;
            background-image: url('https://i.ibb.co/GfVbVffX/photo-1565299624946-b28f40a0ae38.avif');
            background-size: cover;
            background-position: center;
        }
        .main-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.92) 50%, rgba(5,5,5,1) 100%);
        }
        

        .display-font {
            font-family: var(--font-title);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0, 0.5);
        }

        .theme-text {
            color: var(--accent-color);
        }

        .social-link {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-color);
            opacity: 0.6;
        }
        .social-link:hover {
            opacity: 1;
            transform: translateY(-4px) scale(1.05);
            color: var(--accent-color);
        }

        .swiper-slide {
            width: 320px;
            max-width: 85vw;
        }
        .ambiance-swiper .swiper-slide {
            width: auto;
        }
        
        .swiper-pagination-bullet {
            background: var(--text-color) !important;
            opacity: 0.3 !important;
        }
        .swiper-pagination-bullet-active {
            background: var(--accent-color) !important;
            opacity: 1 !important;
        }

        [data-animate] {
            opacity: 0;
            transform: translateY(20px);
            animation: fade-up 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fade-up {
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fade-in {
            to { opacity: 1; }
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
            opacity: 0.04;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        #cursor {
            pointer-events: none;
            position: fixed;
            z-index: 9999;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            mix-blend-difference;
            display: none;
        }

        @media (min-width: 768px) {
            #cursor { display: block; }
            body { cursor: none; }
        }
        
        .container { overflow: hidden; } .background-blur { filter: blur(10px); }
    </style>
</head>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if(document.querySelector('.menu-swiper')) {
          new Swiper('.menu-swiper', {
            effect: 'coverflow',
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 'auto',
            initialSlide: 0,
            coverflowEffect: {
              rotate: 10,
              stretch: 0,
              depth: 100,
              modifier: 1,
              slideShadows: false,
            },
            pagination: {
              el: '.menu-pagination',
              clickable: true,
              dynamicBullets: true,
            },
          });
        }
        
        if(document.querySelector('.ambiance-swiper')) {
          new Swiper('.ambiance-swiper', {
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 1.2,
            spaceBetween: 24,
            loop: true,
            breakpoints: {
              640: { slidesPerView: 2.2 }
            },
            pagination: {
              el: '.ambiance-pagination',
              clickable: true,
              dynamicBullets: true,
            },
          });
        }
      });

      function openLightbox(src) {
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        img.src = src;
        lb.classList.remove('hidden');
        void lb.offsetWidth; // force reflow
        lb.classList.remove('opacity-0', 'pointer-events-none');
        img.classList.remove('scale-95');
        img.classList.add('scale-100');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        lb.classList.add('opacity-0', 'pointer-events-none');
        img.classList.remove('scale-100');
        img.classList.add('scale-95');
        document.body.style.overflow = '';
        setTimeout(() => {
          lb.classList.add('hidden');
        }, 300);
      }
    </script>
  
    
    <script>
      window.addEventListener('load', () => {
        window.scrollTo(0, 0);
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader) {
              loader.style.opacity = '0';
              loader.style.pointerEvents = 'none';
            }
        }, 1500);
      });

      document.addEventListener('DOMContentLoaded', () => {
        window.scrollTo(0, 0);
      });

      document.addEventListener('mousemove', (e) => {
        const cursor = document.getElementById('cursor');
        if (cursor) {
          cursor.style.left = e.clientX + 'px';
          cursor.style.top = e.clientY + 'px';
        }
      });
      document.addEventListener('mousedown', () => {
        const cursor = document.getElementById('cursor');
        if (cursor) cursor.style.transform = 'translate(-50%, -50%) scale(0.5)';
      });
      document.addEventListener('mouseup', () => {
        const cursor = document.getElementById('cursor');
        if (cursor) cursor.style.transform = 'translate(-50%, -50%) scale(1)';
      });

      function handleOrderClick(e, phone) {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (!isMobile || !phone) {
          e.preventDefault();
          const contactSec = document.getElementById('contact-section');
          if (contactSec) {
            contactSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }
      }
    </script>
