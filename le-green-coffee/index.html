    <style>
        :root {
            --bg-color: radial-gradient(circle at 20% 30%, rgba(54, 105, 73, 0.4) 0%, transparent 50%), radial-gradient(circle at 80% 60%, rgba(123, 84, 156, 0.3) 0%, transparent 50%), #2c3e50;
            --text-color: #ffffff;
            --accent-color: #8bc34a;
            --font-title: 'Lato ou Open Sans', serif;
        }

        html {
            background-color: #050505;
            color: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color, #050505);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-attachment: fixed;
        }

        .display-font {
            font-family: var(--font-title);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0, 0.5);
        }

        .theme-text {
            color: var(--accent-color);
        }

        .social-link {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-color);
            opacity: 0.6;
        }
        .social-link:hover {
            opacity: 1;
            transform: translateY(-4px) scale(1.05);
            color: var(--accent-color);
        }

        .swiper-slide {
            width: 320px;
            max-width: 85vw;
        }
        .ambiance-swiper .swiper-slide {
            width: auto;
        }
        
        .swiper-pagination-bullet {
            background: var(--text-color) !important;
            opacity: 0.3 !important;
        }
        .swiper-pagination-bullet-active {
            background: var(--accent-color) !important;
            opacity: 1 !important;
        }

        [data-animate] {
            opacity: 0;
            transform: translateY(20px);
            animation: fade-up 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fade-up {
            to { opacity: 1; transform: translateY(0); }
        }
        
        
    body {
      font-family: 'Lato', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #2c3e50, #3a6073);
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if(document.querySelector('.menu-swiper')) {
          new Swiper('.menu-swiper', {
            effect: 'coverflow',
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 'auto',
            initialSlide: 0,
            coverflowEffect: {
              rotate: 10,
              stretch: 0,
              depth: 100,
              modifier: 1,
              slideShadows: false,
            },
            pagination: {
              el: '.menu-pagination',
              clickable: true,
              dynamicBullets: true,
            },
          });
        }
        
        if(document.querySelector('.ambiance-swiper')) {
          new Swiper('.ambiance-swiper', {
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 1.2,
            spaceBetween: 24,
            loop: true,
            breakpoints: {
              640: { slidesPerView: 2.2 }
            },
            pagination: {
              el: '.ambiance-pagination',
              clickable: true,
              dynamicBullets: true,
            },
          });
        }
      });

      function openLightbox(src) {
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        img.src = src;
        lb.classList.remove('hidden');
        void lb.offsetWidth; // force reflow
        lb.classList.remove('opacity-0', 'pointer-events-none');
        img.classList.remove('scale-95');
        img.classList.add('scale-100');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        lb.classList.add('opacity-0', 'pointer-events-none');
        img.classList.remove('scale-100');
        img.classList.add('scale-95');
        document.body.style.overflow = '';
        setTimeout(() => {
          lb.classList.add('hidden');
        }, 300);
      }
    </script>
