<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le-green Coffee - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap');
        
        :root {
            --theme-color: #4B8D56;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2, h3, .display-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0, 0.4);
        }

        .theme-text {
            color: var(--theme-color);
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }
        .social-btn:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--theme-color);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 30px -10px var(--theme-color);
        }

        .ambient-glow {
            position: absolute;
            width: 60vw;
            height: 60vw;
            background: var(--theme-color);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            animation: pulse-glow 8s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(-10%, -10%); opacity: 0.1; }
            100% { transform: scale(1.1) translate(10%, 10%); opacity: 0.2; }
        }

        .menu-image-container {
            position: relative;
            z-index: 10;
        }
        
        .menu-image-container::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1.5rem;
            background: linear-gradient(45deg, transparent, var(--theme-color), transparent);
            z-index: -1;
            opacity: 0.3;
        }
        
        [data-animate] {
            opacity: 0;
            transform: translateY(20px);
            animation: fade-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fade-up {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 25px; box-shadow: 0 10px 30px rgba(75, 141, 86, 0.15); transition: transform 0.3s ease; } .btn-luxury { background: linear-gradient(135deg, #4B8D56, #2F6A33); color: #fff; border-radius: 30px; font-weight: 600; box-shadow: 0 5px 15px rgba(75, 141, 86, 0.25); } .hero-section { background: url('https://via.placeholder.com/1920x800') no-repeat center center/cover; filter: brightness(0.9) saturate(1.2); }
    </style>
</head>
<body class="relative w-full">
    
    <div class="ambient-glow top-0 left-0"></div>
    <div class="ambient-glow bottom-0 right-0" style="animation-delay: -4s;"></div>

    <div class="max-w-md w-full mx-auto p-6 sm:p-10 z-10 flex flex-col min-h-screen">
        <header class="w-full text-center mt-12 mb-16" data-animate style="animation-delay: 0.1s">
            <h1 class="text-4xl sm:text-5xl font-bold mb-4 tracking-tight text-white display-font leading-tight">Le-green Coffee</h1>
            <p class="text-xs tracking-[0.3em] uppercase text-gray-400 mb-8 font-medium">Fast Food</p>
            <div class="w-12 h-1 bg-white/20 mx-auto rounded-full mb-8 relative overflow-hidden">
                <div class="absolute inset-0 bg-[var(--theme-color)] w-1/2 rounded-full"></div>
            </div>
            <p class="text-lg font-light leading-relaxed text-gray-300 px-4">"Sip, Savor, Speed: La Qualité à la Vitesse de l’Instant"</p>
        </header>

        <main class="w-full flex-grow flex flex-col items-center">
            
            <div class="w-full mb-16 menu-image-container" data-animate style="animation-delay: 0.3s">
                <div class="rounded-[1.4rem] overflow-hidden bg-[#0a0a0a] border border-white/10 p-2 shadow-2xl relative items-center flex justify-center">
                    <img src="https://scontent.fqfd1-1.fna.fbcdn.net/v/t51.82787-15/583581152_17948605464058868_6750097068369374604_n.jpg?stp=dst-jpg_tt6&cstp=mx764x1018&ctp=s764x1018&_nc_cat=105&ccb=1-7&_nc_sid=127cfc&_nc_ohc=IgX-c7RdPJsQ7kNvwEaHw5r&_nc_oc=AdrbFd8BiigTLS1wYrDc-v0LTN2l1o3HBN4qAaN8b_mydCqWIw1N5XH_QQwU8VSK5YI&_nc_zt=23&_nc_ht=scontent.fqfd1-1.fna&_nc_gid=hXifTO8VRnvvrBCykh0ZXg&_nc_ss=7a289&oh=00_Af-JBJb-4vaz2fay4Ck-OmwcC_EdiMj_ojqpc25ayr7-8A&oe=6A2B6179" alt="Menu de Le-green Coffee" class="w-full h-auto rounded-xl object-cover" loading="lazy" />
                </div>
            </div>
            

            <div class="w-full space-y-4 mb-20" data-animate style="animation-delay: 0.5s">
                
                <a href="https://www.google.com/maps/place/Le+green+coffee/@36.6060379,2.1840084,17z/data=!3m1!4b1!4m6!3m5!1s0x128575a0f8fde7f7:0x9a059b2ee16595c2!8m2!3d36.6060336!4d2.1865833!16s%2Fg%2F11vbdpkg06?entry=ttu&g_ep=EgoyMDI2MDYwMS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" class="social-btn flex items-center justify-center space-x-4 w-full py-5 rounded-2xl text-white group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-70 group-hover:theme-text transition-colors"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span class="font-semibold tracking-[0.1em] text-sm uppercase">S'y Rendre</span>
                </a>
                
                
                
                <a href="https://www.instagram.com/la.piazza.green.coffe/" target="_blank" rel="noopener noreferrer" class="social-btn flex items-center justify-center space-x-4 w-full py-5 rounded-2xl text-white group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-70 group-hover:theme-text transition-colors"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
                    <span class="font-semibold tracking-[0.1em] text-sm uppercase">Instagram</span>
                </a>
                
                
                
                
                
                <a href="https://www.facebook.com/la.piazza.green.coffe/" target="_blank" rel="noopener noreferrer" class="social-btn flex items-center justify-center space-x-4 w-full py-5 rounded-2xl text-white group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-70 group-hover:theme-text transition-colors"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                    <span class="font-semibold tracking-[0.1em] text-sm uppercase">Facebook</span>
                </a>
                
            </div>
        </main>

        <footer class="w-full text-center pb-8 border-t border-white/5 pt-10 mt-auto" data-animate style="animation-delay: 0.7s">
            <p class="text-[10px] text-gray-500 uppercase tracking-widest font-medium">© 2026 Le-green Coffee</p>
        </footer>
    </div>

</body>
</html>
