<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Le-green Coffee - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans+ou+Lato:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root {
            --bg-color: radial-gradient(ellipse at bottom, #3498db 0%, #2ecc71 100%);
            --text-color: #f7f7f7;
            --accent-color: #ffd700;
            --font-title: 'Open Sans ou Lato', serif;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-attachment: fixed;
        }

        .display-font {
            font-family: var(--font-title);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0, 0.5);
        }

        .theme-text {
            color: var(--accent-color);
        }

        .social-link {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-color);
            opacity: 0.6;
        }
        .social-link:hover {
            opacity: 1;
            transform: translateY(-4px) scale(1.05);
            color: var(--accent-color);
        }

        .swiper-slide {
            width: 320px;
            max-width: 85vw;
        }
        .ambiance-swiper .swiper-slide {
            width: auto;
        }
        
        .swiper-pagination-bullet {
            background: var(--text-color) !important;
            opacity: 0.3 !important;
        }
        .swiper-pagination-bullet-active {
            background: var(--accent-color) !important;
            opacity: 1 !important;
        }

        [data-animate] {
            opacity: 0;
            transform: translateY(20px);
            animation: fade-up 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fade-up {
            to { opacity: 1; transform: translateY(0); }
        }
        
        
    </style>
</head>
<body class="relative w-full">
    
    <div id="lightbox" class="fixed inset-0 z-[100] hidden bg-black/95 flex justify-center items-center backdrop-blur-xl opacity-0 transition-opacity duration-300 pointer-events-none" onclick="closeLightbox()">
        <div class="absolute top-6 right-6 lg:top-10 lg:right-10 text-white cursor-pointer hover:text-[var(--accent-color)] transition-colors z-[101]" onclick="closeLightbox()">

        </div>
        <img id="lightbox-img" src="" class="max-w-[95vw] max-h-[95vh] object-contain rounded-xl scale-95 transition-transform duration-300 shadow-2xl" onclick="event.stopPropagation()" />
    </div>

        </div>
    </div>
                    </div>
                    <div class="swiper-pagination menu-pagination"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if(document.querySelector('.menu-swiper')) {
          new Swiper('.menu-swiper', {
            effect: 'coverflow',
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 'auto',
            initialSlide: 0,
            coverflowEffect: {
              rotate: 10,
              stretch: 0,
              depth: 100,
              modifier: 1,
              slideShadows: false,
            },
            pagination: {
              el: '.menu-pagination',
              clickable: true,
              dynamicBullets: true,
            },
          });
        }
        
        if(document.querySelector('.ambiance-swiper')) {
          new Swiper('.ambiance-swiper', {
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 1.2,
            spaceBetween: 24,
            loop: true,
            breakpoints: {
              640: { slidesPerView: 2.2 }
            },
            pagination: {
              el: '.ambiance-pagination',
              clickable: true,
              dynamicBullets: true,
            },
          });
        }
      });

      function openLightbox(src) {
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        img.src = src;
        lb.classList.remove('hidden');
        void lb.offsetWidth; // force reflow
        lb.classList.remove('opacity-0', 'pointer-events-none');
        img.classList.remove('scale-95');
        img.classList.add('scale-100');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        const lb = document.getElementById('lightbox');
        const img = document.getElementById('lightbox-img');
        lb.classList.add('opacity-0', 'pointer-events-none');
        img.classList.remove('scale-100');
        img.classList.add('scale-95');
        document.body.style.overflow = '';
        setTimeout(() => {
          lb.classList.add('hidden');
        }, 300);
      }
    </script>
  
</body>
