<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le-green Coffee - Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');
        
        :root {
            --theme-color: #55A755;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f1115;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .theme-text {
            color: var(--theme-color);
        }

        .social-btn {
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            transform: translateY(-2px);
            border-color: var(--theme-color);
            box-shadow: 0 10px 20px -10px var(--theme-color);
        }
    </style>
</head>
<body class="flex flex-col items-center p-6 sm:p-10 max-w-md mx-auto">
    
    <header class="w-full text-center mt-8 mb-12">
        <h1 class="text-4xl sm:text-5xl font-semibold mb-3 tracking-wide text-white">Le-green Coffee</h1>
        <p class="text-sm tracking-[0.2em] uppercase text-gray-400 mb-6">Fast Food</p>
        <p class="text-lg italic serif theme-text px-4">"Un café où la folie du vert allume l’énergique routine"</p>
    </header>

    <main class="w-full flex-grow flex flex-col items-center">
        
        <div class="w-full mb-12 rounded-2xl overflow-hidden glass p-2 shadow-2xl relative">
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10 pointer-events-none"></div>
            <img src="https://scontent.fqfd1-1.fna.fbcdn.net/v/t51.82787-15/583581152_17948605464058868_6750097068369374604_n.jpg?stp=dst-jpg_tt6&cstp=mx764x1018&ctp=s764x1018&_nc_cat=105&ccb=1-7&_nc_sid=127cfc&_nc_ohc=IgX-c7RdPJsQ7kNvwEaHw5r&_nc_oc=AdrbFd8BiigTLS1wYrDc-v0LTN2l1o3HBN4qAaN8b_mydCqWIw1N5XH_QQwU8VSK5YI&_nc_zt=23&_nc_ht=scontent.fqfd1-1.fna&_nc_gid=hXifTO8VRnvvrBCykh0ZXg&_nc_ss=7a289&oh=00_Af-JBJb-4vaz2fay4Ck-OmwcC_EdiMj_ojqpc25ayr7-8A&oe=6A2B6179" alt="Menu de Le-green Coffee" class="w-full h-auto rounded-xl object-cover" />
        </div>
        

        <div class="w-full space-y-4 mb-16">
            
            <a href="https://www.google.com/maps/place/Le+green+coffee/@36.6060379,2.1840084,17z/data=!3m1!4b1!4m6!3m5!1s0x128575a0f8fde7f7:0x9a059b2ee16595c2!8m2!3d36.6060336!4d2.1865833!16s%2Fg%2F11vbdpkg06?entry=ttu&g_ep=EgoyMDI2MDYwMS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" class="social-btn glass flex items-center justify-center space-x-3 w-full py-4 rounded-xl text-white group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70 group-hover:theme-text transition-colors"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="font-medium tracking-wide text-sm uppercase">Nous trouver</span>
            </a>
            
            
            
            <a href="https://www.instagram.com/la.piazza.green.coffe/" target="_blank" rel="noopener noreferrer" class="social-btn glass flex items-center justify-center space-x-3 w-full py-4 rounded-xl text-white group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70 group-hover:theme-text transition-colors"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
                <span class="font-medium tracking-wide text-sm uppercase">Instagram</span>
            </a>
            
            
            
            
            
            <a href="https://www.facebook.com/la.piazza.green.coffe/" target="_blank" rel="noopener noreferrer" class="social-btn glass flex items-center justify-center space-x-3 w-full py-4 rounded-xl text-white group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-70 group-hover:theme-text transition-colors"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                <span class="font-medium tracking-wide text-sm uppercase">Facebook</span>
            </a>
            
        </div>
    </main>

    <footer class="w-full text-center pb-8 border-t border-white/10 pt-8 mt-auto">
        <p class="text-xs text-gray-500 uppercase tracking-widest ">© 2026 Le-green Coffee</p>
    </footer>

</body>
</html>
